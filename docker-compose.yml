services:
  monitor:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      DATABASE_PATH: /data/internship-monitor.db
      BROWSER_PROFILE_DIR: /data/browser-profile
      JOB_SOURCE: simplify
      ENABLE_HIRING_CAFE: "false"
      SIMPLIFY_LISTINGS_URL: "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json"
      SCAN_INTERVAL_MINUTES: "60"
      PLAYWRIGHT_HEADLESS: "true"
    restart: unless-stopped
