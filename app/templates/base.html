<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }} · Internship Monitor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <p class="eyebrow">Internship Monitor</p>
        <h1>{{ page_title }}</h1>
      </div>
      <nav class="nav">
        <a href="/" class="{% if page_title == 'New internships' %}active{% endif %}">New</a>
        <a href="/saved" class="{% if page_title == 'Saved internships' %}active{% endif %}">Saved</a>
        <a href="/runs" class="{% if page_title == 'Scan history' %}active{% endif %}">Runs</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
